openapi: 3.1.0
info:
  title: Dashboard API
  version: 0.5.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Contract between the frontend and the backend of the Dashboard (internal to the sub-product).
    Everything is computed from the log lines (contracts/logline.openapi.yaml) of one experiment.
    Without the parameter experiment: the experiment of the most recent log line.
    Every showcase has its own Dashboard; the overview says which showcase.
    The live view (/api/v1/live) pushes the state of the running pipelines with Server-Sent Events.
    The buttons of the product owner are commands (/api/v1/commands): the Dashboard keeps them, the Pipeline agent
    claims and carries them out. The Dashboard never runs a pipeline itself. No login in mvp0 (explain proposed, fcd-demo#4):
    the name of the one who presses is the approver from the configuration.
servers:
  - url: /
    description: The backend, reached through the frontend
tags:
  - name: dashboard
    description: What the Dashboard shows
  - name: commands
    description: The buttons of the product owner, carried out by the Pipeline agent
paths:
  /api/v1/events:
    get:
      tags: [dashboard]
      operationId: getEvents
      summary: The log of an experiment, one log line per line (to keep in the showcase repository)
      parameters:
        - $ref: '#/components/parameters/experiment'
      responses:
        '200':
          description: The log lines (NDJSON).
          content:
            application/x-ndjson:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/overview:
    get:
      tags: [dashboard]
      operationId: getOverview
      summary: Status per product and sub-product
      parameters:
        - $ref: '#/components/parameters/experiment'
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/products/{product}/subproducts/{name}:
    get:
      tags: [dashboard]
      operationId: getSubProduct
      summary: One sub-product with its runs
      parameters:
        - $ref: '#/components/parameters/experiment'
        - { name: product, in: path, required: true, schema: { $ref: '#/components/schemas/Name' } }
        - { name: name, in: path, required: true, schema: { $ref: '#/components/schemas/Name' } }
      responses:
        '200':
          description: The sub-product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubProduct' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/kpis:
    get:
      tags: [dashboard]
      operationId: getKpis
      summary: KPIs of the way of working (DORA, gates, trend)
      parameters:
        - $ref: '#/components/parameters/experiment'
      responses:
        '200':
          description: The KPIs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kpis' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/keyresult:
    get:
      tags: [dashboard]
      operationId: getKeyResult
      summary: Key result of the intent Bestellen
      parameters:
        - $ref: '#/components/parameters/experiment'
      responses:
        '200':
          description: The key result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyResult' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/report:
    get:
      tags: [dashboard]
      operationId: getReport
      summary: Status report - Markdown, a readable HTML page, or the HTML for inside the Dashboard
      parameters:
        - $ref: '#/components/parameters/experiment'
        - { name: download, in: query, required: false, schema: { type: string, enum: ['true', 'false'] } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [markdown, html, fragment], default: markdown }, description: 'html - a whole page to keep and read; fragment - the content only, for the Dashboard' }
      responses:
        '200':
          description: The status report.
          content:
            text/markdown:
              schema: { type: string }
            text/html:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/tests:
    get:
      tags: [dashboard]
      operationId: getTests
      summary: Latest test results per sub-product and test type
      parameters:
        - $ref: '#/components/parameters/experiment'
      responses:
        '200':
          description: Test results.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Test' } }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/loglines:
    get:
      tags: [dashboard]
      operationId: getLoglines
      summary: The log lines, newest first
      parameters:
        - $ref: '#/components/parameters/experiment'
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        '200':
          description: Log lines.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LoglineRow' } }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/live/state:
    get:
      tags: [dashboard]
      operationId: getLiveState
      summary: The live view now - per sub-product the current run, with its steps and gates in the order of the configuration
      parameters:
        - $ref: '#/components/parameters/experiment'
      responses:
        '200':
          description: The live state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveState' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/live:
    get:
      tags: [dashboard]
      operationId: getLiveStream
      summary: The live view as a stream (Server-Sent Events)
      description: |
        Only with "Accept: text/event-stream" (EventSource in the browser). First the state now, then the new state
        after every log line ("event: live-state", data is a LiveState as JSON), and every 15 s a heartbeat (a comment).
        The server ends the stream after 30 minutes; EventSource connects again by itself.
      parameters:
        - $ref: '#/components/parameters/experiment'
      responses:
        '200':
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '406': { $ref: '#/components/responses/Problem' }
  /api/v1/changelog:
    get:
      tags: [dashboard]
      operationId: getChangelog
      summary: Per sub-product the changelog of the version deployed last (from the log line service.deployed)
      parameters:
        - $ref: '#/components/parameters/experiment'
      responses:
        '200':
          description: The changelogs.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Changelog' } }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/commands:
    get:
      tags: [commands]
      operationId: getCommands
      summary: The most recent commands, newest first (to show what the Pipeline did with a button)
      responses:
        '200':
          description: The commands.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Command' } }
    post:
      tags: [commands]
      operationId: createCommand
      summary: A button of the product owner - start the pipeline, approve the release, or reset the demo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandRequest' }
      responses:
        '202':
          description: Kept; the Pipeline agent carries it out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/commands/claim:
    post:
      tags: [commands]
      operationId: claimCommand
      summary: For the Pipeline agent - the oldest pending command of these kinds, now claimed
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, pattern: '^[a-z-]+(,[a-z-]+)*$' }, description: 'Kinds, comma separated' }
        - { name: run, in: query, required: false, schema: { type: string, maxLength: 200 }, description: 'Only commands for this run (approve-release)' }
      responses:
        '200':
          description: The claimed command.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }
        '204': { description: No pending command. }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/commands/{id}/done:
    post:
      tags: [commands]
      operationId: finishCommand
      summary: For the Pipeline agent - the outcome of a claimed command
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [done, failed, rejected] }
                message: { type: string, maxLength: 1000 }
      responses:
        '204': { description: Recorded. }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    experiment:
      name: experiment
      in: query
      required: false
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,50}$' }
  responses:
    Problem:
      description: Error (RFC 9457), without internal details.
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
  schemas:
    Name: { type: string, pattern: '^[a-z0-9-]{1,100}$' }
    Status: { type: string, enum: [green, red, running, unknown] }
    Overview:
      type: object
      required: [showcase, experiment, experiments, generatedAt, products]
      properties:
        showcase: { type: string }
        experiment: { type: string }
        experiments: { type: array, items: { type: string } }
        generatedAt: { type: string, format: date-time }
        products: { type: array, items: { $ref: '#/components/schemas/Product' } }
    Product:
      type: object
      required: [name, status, subProducts, tests]
      properties:
        name: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        subProducts: { type: array, items: { $ref: '#/components/schemas/SubProduct' } }
        tests: { type: array, items: { $ref: '#/components/schemas/TestTotals' } }
    SubProduct:
      type: object
      required: [product, name, status, releases, explains, runs]
      properties:
        product: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        lastRun: { $ref: '#/components/schemas/Run' }
        deployed:
          type: object
          required: [version, containers, environment, at]
          properties:
            version: { type: string }
            containers: { type: object, additionalProperties: { type: string } }
            environment: { type: string }
            at: { type: string, format: date-time }
        releases:
          type: array
          items:
            type: object
            required: [tag, releaseType, at]
            properties:
              tag: { type: string }
              releaseType: { type: string }
              at: { type: string, format: date-time }
        explains:
          type: array
          items:
            type: object
            required: [id, gate, lastUsed]
            properties:
              id: { type: string }
              gate: { type: string }
              rule: { type: string }
              reason: { type: string }
              approver: { type: string }
              until: { type: string }
              lastUsed: { type: string, format: date-time }
        runs:
          type: array
          items:
            type: object
            required: [run, version, environment, started, outcome, triggerName]
            properties:
              run: { type: string }
              version: { type: string }
              environment: { type: string }
              started: { type: string, format: date-time }
              outcome: { type: string }
              stuckAt: { type: string }
              triggerName: { type: string }
    Run:
      type: object
      required: [run, product, subProduct, version, environment, triggerKind, triggerName, releaseType, commit, started, outcome, steps, gates, tests]
      properties:
        run: { type: string }
        product: { type: string }
        subProduct: { type: string }
        version: { type: string }
        environment: { type: string }
        triggerKind: { type: string }
        triggerName: { type: string }
        releaseType: { type: string }
        commit: { type: string }
        started: { type: string, format: date-time }
        finished: { type: string, format: date-time }
        outcome: { type: string, enum: [running, success, failure] }
        seconds: { type: number }
        stuckAt: { type: string }
        warnings: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [step, name, title, outcome]
            properties:
              step: { type: integer }
              name: { type: string }
              title: { type: string }
              outcome: { type: string, enum: [running, succeeded, failed, skipped] }
              reason: { type: string }
              seconds: { type: number }
        gates:
          type: array
          items:
            type: object
            required: [gate, afterSteps, outcome, explains]
            properties:
              gate: { type: string }
              afterSteps: { type: string }
              outcome: { type: string, enum: [open, closed] }
              reason: { type: string }
              explains: { type: array, items: { type: string } }
        tests: { type: array, items: { $ref: '#/components/schemas/Test' } }
    Test:
      type: object
      required: [subProduct, testType, tests, passed, failed, skipped, seconds, run, at]
      properties:
        subProduct: { type: string }
        testType: { type: string }
        tests: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }
        seconds: { type: number }
        failures: { type: string }
        run: { type: string }
        at: { type: string, format: date-time }
    TestTotals:
      type: object
      required: [testType, tests, passed, failed, skipped, seconds]
      properties:
        testType: { type: string }
        tests: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }
        seconds: { type: number }
    LoglineRow:
      type: object
      required: [id, time, seconds, triggerKind, triggerName, product, subProduct, version, environment, type, action, outcome, run]
      properties:
        id: { type: string }
        time: { type: string, format: date-time }
        seconds: { type: number }
        triggerKind: { type: string }
        triggerName: { type: string }
        product: { type: string }
        subProduct: { type: string }
        version: { type: string }
        environment: { type: string }
        type: { type: string }
        action: { type: string }
        outcome: { type: string }
        reason: { type: string }
        run: { type: string }
    Dora:
      type: object
      required: [product, subProduct, deployments, deploymentsPerDay, failedChanges, restores]
      properties:
        product: { type: string }
        subProduct: { type: string }
        deployments: { type: integer }
        deploymentsPerDay: { type: number }
        leadTimeMedianMinutes: { type: number }
        failedChanges: { type: integer }
        changeFailureRate: { type: number }
        restoreMedianMinutes: { type: number }
        restores:
          type: array
          items:
            type: object
            required: [failedVersion, patchVersion, minutes, at]
            properties:
              failedVersion: { type: string }
              patchVersion: { type: string }
              minutes: { type: number }
              at: { type: string, format: date-time }
        pipelineSecondsAverage: { type: number }
    Kpis:
      type: object
      required: [experiment, products, gates, trend, activeExplains]
      properties:
        experiment: { type: string }
        products:
          type: array
          items:
            type: object
            required: [name, dora, subProducts]
            properties:
              name: { type: string }
              dora: { $ref: '#/components/schemas/Dora' }
              subProducts: { type: array, items: { $ref: '#/components/schemas/Dora' } }
        gates:
          type: array
          items:
            type: object
            required: [gate, evaluated, closed, reasons]
            properties:
              gate: { type: string }
              evaluated: { type: integer }
              closed: { type: integer }
              reasons:
                type: array
                items:
                  type: object
                  required: [reason, count]
                  properties:
                    reason: { type: string }
                    count: { type: integer }
        trend:
          type: array
          items:
            type: object
            required: [day, deployments, runs, runsFailed, gatesClosed]
            properties:
              day: { type: string, format: date }
              deployments: { type: integer }
              leadTimeMedianMinutes: { type: number }
              runs: { type: integer }
              runsFailed: { type: integer }
              gatesClosed: { type: integer }
              pipelineSecondsAverage: { type: number }
              keyResultPercent: { type: number }
        activeExplains: { type: integer }
        keyResultPercent: { type: number }
    KeyResult:
      type: object
      required: [experiment, keyResult, orders, complete, incomplete]
      properties:
        experiment: { type: string }
        keyResult: { type: string }
        orders: { type: integer }
        complete: { type: integer }
        percent: { type: number }
        incomplete:
          type: array
          items:
            type: object
            required: [orderId, tableNumber, at, missing]
            properties:
              orderId: { type: string }
              tableNumber: { type: integer }
              at: { type: string, format: date-time }
              missing: { type: array, items: { type: string } }
        version: { type: string, description: 'Version of the sub-product that measured the last order' }
        versions:
          type: array
          description: The key result per version of the sub-product, in order of the first order
          items:
            type: object
            required: [version, orders, complete]
            properties:
              version: { type: string }
              orders: { type: integer }
              complete: { type: integer }
              percent: { type: number }
        receivers:
          type: array
          description: Per receiver - did the last order arrive; stub when a stub stands in for it (configuration)
          items:
            type: object
            required: [name, title, stub, lastArrived, arrived]
            properties:
              name: { type: string }
              title: { type: string }
              stub: { type: boolean }
              lastArrived: { type: boolean }
              arrived: { type: integer }
    LiveState:
      type: object
      required: [showcase, experiment, serverTime, settings, runs, controls, commands]
      properties:
        showcase: { type: string }
        experiment: { type: string }
        serverTime: { type: string, format: date-time, description: 'For the running time in the browser' }
        settings: { $ref: '#/components/schemas/LiveSettings' }
        runs: { type: array, items: { $ref: '#/components/schemas/LiveRun' } }
        controls: { $ref: '#/components/schemas/Controls' }
        commands: { type: array, items: { $ref: '#/components/schemas/Command' }, description: 'Pending and recent commands, newest first' }
        dashboardVersion: { type: string, description: 'The version of the Dashboard (versions.env)' }
        demo:
          type: object
          description: 'Demo mode: where the demo is (from the log lines fcd-demo.reset and fcd-demo.merged of this experiment)'
          required: [phase, unmerged]
          properties:
            phase: { type: string, enum: [start, merged], description: 'start - after the reset, a prepared change waits to be merged; merged - nothing waits' }
            unmerged: { type: array, items: { type: string }, description: 'The prepared changes not merged yet (repository branch)' }
        running:
          type: array
          description: Per sub-product the version deployed last in this experiment (what runs now), with its containers
          items:
            type: object
            required: [subProduct, title, version]
            properties:
              product: { type: string }
              productTitle: { type: string }
              subProduct: { type: string }
              title: { type: string }
              version: { type: string }
              containers: { type: object, additionalProperties: { type: string } }
              deployedAt: { type: string, format: date-time }
              stubs:
                type: array
                description: The stubs that run along (configuration Container.spec.stub), with their version and the receiver they stand in for
                items:
                  type: object
                  required: [name, title, receiver]
                  properties:
                    name: { type: string }
                    title: { type: string }
                    receiver: { type: string }
                    version: { type: string }
    Controls:
      type: object
      description: Which buttons the Dashboard shows (configuration of the showcase).
      required: [startButton, demoReset]
      properties:
        startButton: { type: boolean, description: 'Pipeline.spec.trigger is dashboard-button' }
        demoReset: { type: boolean, description: 'Demo mode: Pipeline.spec.demo is set' }
        approver: { type: string, description: 'Who presses (QualityGate human, spec.approver)' }
    CommandRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [start-run, approve-release, demo-reset, demo-merge] }
        run: { type: string, maxLength: 200, description: 'approve-release: the run that waits at the human gate' }
        save: { type: boolean, description: 'demo-reset: keep the run and the status report first' }
    Command:
      type: object
      required: [id, kind, requestedBy, requestedAt, status]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [start-run, approve-release, demo-reset, demo-merge] }
        run: { type: string }
        save: { type: boolean }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, claimed, done, failed, rejected] }
        message: { type: string }
    Changelog:
      type: object
      required: [product, subProduct, version, text]
      properties:
        product: { type: string }
        subProduct: { type: string }
        title: { type: string }
        version: { type: string }
        containers: { type: object, additionalProperties: { type: string } }
        deployedAt: { type: string, format: date-time }
        text: { type: string, description: 'Markdown (Keep a Changelog); shown as text, never as HTML' }
    LiveSettings:
      type: object
      description: From the configuration of the showcase (kind Dashboard, spec.live); defaults without configuration.
      required: [configured, subProducts, environments, layout, keepFinishedSeconds, presentation]
      properties:
        configured: { type: boolean, description: 'The configuration of the showcase was read' }
        subProducts: { type: array, items: { type: string }, description: 'Which sub-products, in this order; empty is all' }
        environments: { type: array, items: { type: string }, description: 'Which runs (werkplek, lokaal); empty is all' }
        layout: { type: string, enum: [stacked, side-by-side] }
        keepFinishedSeconds: { type: integer, minimum: 0 }
        presentation:
          type: object
          required: [theme, fontScale, focusRunning]
          properties:
            title: { type: string }
            theme: { type: string, enum: [dark, light] }
            fontScale: { type: number }
            focusRunning: { type: boolean }
    LiveRun:
      type: object
      required: [product, subProduct, title, run, version, environment, triggerKind, triggerName, releaseType, commit, started, outcome, deployed, items]
      properties:
        product: { type: string }
        subProduct: { type: string }
        title: { type: string }
        run: { type: string }
        version: { type: string }
        environment: { type: string }
        triggerKind: { type: string }
        triggerName: { type: string }
        releaseType: { type: string }
        commit: { type: string }
        started: { type: string, format: date-time }
        finished: { type: string, format: date-time }
        outcome: { type: string, enum: [running, success, failure] }
        seconds: { type: number }
        stuckAt: { type: string }
        waitingFor: { $ref: '#/components/schemas/WaitingFor' }
        failure:
          type: object
          required: [title]
          properties:
            title: { type: string }
            reason: { type: string }
            excerpt: { type: string }
            failures: { type: string }
        tag: { type: string }
        deployed: { type: boolean }
        containers: { type: object, additionalProperties: { type: string }, description: 'Container versions in this version of the sub-product' }
        items: { type: array, items: { $ref: '#/components/schemas/LiveItem' }, description: 'The row of the sub-product' }
        startGate: { $ref: '#/components/schemas/LiveItem' }
        containerRows:
          type: array
          description: Per container of the sub-product a row with the steps of level container (up to building), and the gates that close after them only (such as the code gate).
          items:
            type: object
            required: [container, title, items]
            properties:
              container: { type: string }
              title: { type: string }
              version: { type: string }
              items: { type: array, items: { $ref: '#/components/schemas/LiveItem' } }
    LiveItem:
      type: object
      description: A CI step or a quality gate on the line, in the order of the configuration.
      required: [kind, name, title, status, explains]
      properties:
        kind: { type: string, enum: [step, gate] }
        name: { type: string }
        title: { type: string }
        status:
          type: string
          description: Step - waiting, running, succeeded, failed, explained (found something its gate let through with an approved explain), unchanged (skipped because its container did not change - already green at that version), skipped, not-run, backlog (not built yet). Gate - pending, deciding, waiting (for a human), open, closed, not-run.
          enum: [waiting, running, succeeded, failed, explained, unchanged, skipped, not-run, backlog, pending, deciding, open, closed]
        step: { type: integer }
        startedAt: { type: string, format: date-time }
        seconds: { type: number }
        reason: { type: string }
        excerpt: { type: string }
        explains: { type: array, items: { type: string } }
        container: { type: string }
        shortened:
          type: object
          description: A step shortened for the demo, with its approved explain (configuration Step.spec.shortened)
          required: [explain]
          properties:
            explain: { type: string }
            reason: { type: string }
            until: { type: string }
        waitingFor: { $ref: '#/components/schemas/WaitingFor' }
        tests:
          type: object
          required: [testType, tests, passed, failed, skipped, finished]
          properties:
            testType: { type: string }
            tests: { type: integer }
            passed: { type: integer }
            failed: { type: integer }
            skipped: { type: integer }
            expected: { type: integer }
            finished: { type: boolean }
    WaitingFor:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string }
        name: { type: string }
        action: { type: string }
