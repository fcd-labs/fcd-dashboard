openapi: 3.1.0
info:
  title: Dashboard API
  version: 0.4.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Contract between the frontend and the backend of the Dashboard (internal to the sub-product).
    Everything is computed from the log lines (contracts/logline.openapi.yaml) of one experiment.
    Without the parameter experiment: the experiment of the most recent log line.
    Every showcase has its own Dashboard; the overview says which showcase.
    The live view (/api/v1/live) pushes the state of the running pipelines with Server-Sent Events.
servers:
  - url: /
    description: The backend, reached through the frontend
tags:
  - name: dashboard
    description: What the Dashboard shows
paths:
  /api/v1/events:
    get:
      tags: [dashboard]
      operationId: getEvents
      summary: The log of an experiment, one log line per line (to keep in the showcase repository)
      parameters:
        - $ref: '#/components/parameters/experiment'
      responses:
        '200':
          description: The log lines (NDJSON).
          content:
            application/x-ndjson:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/overview:
    get:
      tags: [dashboard]
      operationId: getOverview
      summary: Status per product and sub-product
      parameters:
        - $ref: '#/components/parameters/experiment'
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/products/{product}/subproducts/{name}:
    get:
      tags: [dashboard]
      operationId: getSubProduct
      summary: One sub-product with its runs
      parameters:
        - $ref: '#/components/parameters/experiment'
        - { name: product, in: path, required: true, schema: { $ref: '#/components/schemas/Name' } }
        - { name: name, in: path, required: true, schema: { $ref: '#/components/schemas/Name' } }
      responses:
        '200':
          description: The sub-product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubProduct' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/kpis:
    get:
      tags: [dashboard]
      operationId: getKpis
      summary: KPIs of the way of working (DORA, gates, trend)
      parameters:
        - $ref: '#/components/parameters/experiment'
      responses:
        '200':
          description: The KPIs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kpis' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/keyresult:
    get:
      tags: [dashboard]
      operationId: getKeyResult
      summary: Key result of the intent Bestellen
      parameters:
        - $ref: '#/components/parameters/experiment'
      responses:
        '200':
          description: The key result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyResult' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/report:
    get:
      tags: [dashboard]
      operationId: getReport
      summary: Status report (Markdown)
      parameters:
        - $ref: '#/components/parameters/experiment'
        - { name: download, in: query, required: false, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: The status report.
          content:
            text/markdown:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/tests:
    get:
      tags: [dashboard]
      operationId: getTests
      summary: Latest test results per sub-product and test type
      parameters:
        - $ref: '#/components/parameters/experiment'
      responses:
        '200':
          description: Test results.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Test' } }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/loglines:
    get:
      tags: [dashboard]
      operationId: getLoglines
      summary: The log lines, newest first
      parameters:
        - $ref: '#/components/parameters/experiment'
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        '200':
          description: Log lines.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LoglineRow' } }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/live/state:
    get:
      tags: [dashboard]
      operationId: getLiveState
      summary: The live view now - per sub-product the current run, with its steps and gates in the order of the configuration
      parameters:
        - $ref: '#/components/parameters/experiment'
      responses:
        '200':
          description: The live state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveState' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/live:
    get:
      tags: [dashboard]
      operationId: getLiveStream
      summary: The live view as a stream (Server-Sent Events)
      description: |
        Only with "Accept: text/event-stream" (EventSource in the browser). First the state now, then the new state
        after every log line ("event: live-state", data is a LiveState as JSON), and every 15 s a heartbeat (a comment).
        The server ends the stream after 30 minutes; EventSource connects again by itself.
      parameters:
        - $ref: '#/components/parameters/experiment'
      responses:
        '200':
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '406': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    experiment:
      name: experiment
      in: query
      required: false
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,50}$' }
  responses:
    Problem:
      description: Error (RFC 9457), without internal details.
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
  schemas:
    Name: { type: string, pattern: '^[a-z0-9-]{1,100}$' }
    Status: { type: string, enum: [green, red, running, unknown] }
    Overview:
      type: object
      required: [showcase, experiment, experiments, generatedAt, products]
      properties:
        showcase: { type: string }
        experiment: { type: string }
        experiments: { type: array, items: { type: string } }
        generatedAt: { type: string, format: date-time }
        products: { type: array, items: { $ref: '#/components/schemas/Product' } }
    Product:
      type: object
      required: [name, status, subProducts, tests]
      properties:
        name: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        subProducts: { type: array, items: { $ref: '#/components/schemas/SubProduct' } }
        tests: { type: array, items: { $ref: '#/components/schemas/TestTotals' } }
    SubProduct:
      type: object
      required: [product, name, status, releases, explains, runs]
      properties:
        product: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        lastRun: { $ref: '#/components/schemas/Run' }
        deployed:
          type: object
          required: [version, containers, environment, at]
          properties:
            version: { type: string }
            containers: { type: object, additionalProperties: { type: string } }
            environment: { type: string }
            at: { type: string, format: date-time }
        releases:
          type: array
          items:
            type: object
            required: [tag, releaseType, at]
            properties:
              tag: { type: string }
              releaseType: { type: string }
              at: { type: string, format: date-time }
        explains:
          type: array
          items:
            type: object
            required: [id, gate, lastUsed]
            properties:
              id: { type: string }
              gate: { type: string }
              rule: { type: string }
              reason: { type: string }
              approver: { type: string }
              until: { type: string }
              lastUsed: { type: string, format: date-time }
        runs:
          type: array
          items:
            type: object
            required: [run, version, environment, started, outcome, triggerName]
            properties:
              run: { type: string }
              version: { type: string }
              environment: { type: string }
              started: { type: string, format: date-time }
              outcome: { type: string }
              stuckAt: { type: string }
              triggerName: { type: string }
    Run:
      type: object
      required: [run, product, subProduct, version, environment, triggerKind, triggerName, releaseType, commit, started, outcome, steps, gates, tests]
      properties:
        run: { type: string }
        product: { type: string }
        subProduct: { type: string }
        version: { type: string }
        environment: { type: string }
        triggerKind: { type: string }
        triggerName: { type: string }
        releaseType: { type: string }
        commit: { type: string }
        started: { type: string, format: date-time }
        finished: { type: string, format: date-time }
        outcome: { type: string, enum: [running, success, failure] }
        seconds: { type: number }
        stuckAt: { type: string }
        warnings: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [step, name, title, outcome]
            properties:
              step: { type: integer }
              name: { type: string }
              title: { type: string }
              outcome: { type: string, enum: [running, succeeded, failed, skipped] }
              reason: { type: string }
              seconds: { type: number }
        gates:
          type: array
          items:
            type: object
            required: [gate, afterSteps, outcome, explains]
            properties:
              gate: { type: string }
              afterSteps: { type: string }
              outcome: { type: string, enum: [open, closed] }
              reason: { type: string }
              explains: { type: array, items: { type: string } }
        tests: { type: array, items: { $ref: '#/components/schemas/Test' } }
    Test:
      type: object
      required: [subProduct, testType, tests, passed, failed, skipped, seconds, run, at]
      properties:
        subProduct: { type: string }
        testType: { type: string }
        tests: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }
        seconds: { type: number }
        failures: { type: string }
        run: { type: string }
        at: { type: string, format: date-time }
    TestTotals:
      type: object
      required: [testType, tests, passed, failed, skipped, seconds]
      properties:
        testType: { type: string }
        tests: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }
        seconds: { type: number }
    LoglineRow:
      type: object
      required: [id, time, seconds, triggerKind, triggerName, product, subProduct, version, environment, type, action, outcome, run]
      properties:
        id: { type: string }
        time: { type: string, format: date-time }
        seconds: { type: number }
        triggerKind: { type: string }
        triggerName: { type: string }
        product: { type: string }
        subProduct: { type: string }
        version: { type: string }
        environment: { type: string }
        type: { type: string }
        action: { type: string }
        outcome: { type: string }
        reason: { type: string }
        run: { type: string }
    Dora:
      type: object
      required: [product, subProduct, deployments, deploymentsPerDay, failedChanges, restores]
      properties:
        product: { type: string }
        subProduct: { type: string }
        deployments: { type: integer }
        deploymentsPerDay: { type: number }
        leadTimeMedianMinutes: { type: number }
        failedChanges: { type: integer }
        changeFailureRate: { type: number }
        restoreMedianMinutes: { type: number }
        restores:
          type: array
          items:
            type: object
            required: [failedVersion, patchVersion, minutes, at]
            properties:
              failedVersion: { type: string }
              patchVersion: { type: string }
              minutes: { type: number }
              at: { type: string, format: date-time }
        pipelineSecondsAverage: { type: number }
    Kpis:
      type: object
      required: [experiment, products, gates, trend, activeExplains]
      properties:
        experiment: { type: string }
        products:
          type: array
          items:
            type: object
            required: [name, dora, subProducts]
            properties:
              name: { type: string }
              dora: { $ref: '#/components/schemas/Dora' }
              subProducts: { type: array, items: { $ref: '#/components/schemas/Dora' } }
        gates:
          type: array
          items:
            type: object
            required: [gate, evaluated, closed, reasons]
            properties:
              gate: { type: string }
              evaluated: { type: integer }
              closed: { type: integer }
              reasons:
                type: array
                items:
                  type: object
                  required: [reason, count]
                  properties:
                    reason: { type: string }
                    count: { type: integer }
        trend:
          type: array
          items:
            type: object
            required: [day, deployments, runs, runsFailed, gatesClosed]
            properties:
              day: { type: string, format: date }
              deployments: { type: integer }
              leadTimeMedianMinutes: { type: number }
              runs: { type: integer }
              runsFailed: { type: integer }
              gatesClosed: { type: integer }
              pipelineSecondsAverage: { type: number }
              keyResultPercent: { type: number }
        activeExplains: { type: integer }
        keyResultPercent: { type: number }
    KeyResult:
      type: object
      required: [experiment, keyResult, orders, complete, incomplete]
      properties:
        experiment: { type: string }
        keyResult: { type: string }
        orders: { type: integer }
        complete: { type: integer }
        percent: { type: number }
        incomplete:
          type: array
          items:
            type: object
            required: [orderId, tableNumber, at, missing]
            properties:
              orderId: { type: string }
              tableNumber: { type: integer }
              at: { type: string, format: date-time }
              missing: { type: array, items: { type: string } }
    LiveState:
      type: object
      required: [showcase, experiment, serverTime, settings, runs]
      properties:
        showcase: { type: string }
        experiment: { type: string }
        serverTime: { type: string, format: date-time, description: 'For the running time in the browser' }
        settings: { $ref: '#/components/schemas/LiveSettings' }
        runs: { type: array, items: { $ref: '#/components/schemas/LiveRun' } }
    LiveSettings:
      type: object
      description: From the configuration of the showcase (kind Dashboard, spec.live); defaults without configuration.
      required: [configured, subProducts, environments, layout, keepFinishedSeconds, presentation]
      properties:
        configured: { type: boolean, description: 'The configuration of the showcase was read' }
        subProducts: { type: array, items: { type: string }, description: 'Which sub-products, in this order; empty is all' }
        environments: { type: array, items: { type: string }, description: 'Which runs (werkplek, lokaal); empty is all' }
        layout: { type: string, enum: [stacked, side-by-side] }
        keepFinishedSeconds: { type: integer, minimum: 0 }
        presentation:
          type: object
          required: [theme, fontScale, focusRunning]
          properties:
            title: { type: string }
            theme: { type: string, enum: [dark, light] }
            fontScale: { type: number }
            focusRunning: { type: boolean }
    LiveRun:
      type: object
      required: [product, subProduct, title, run, version, environment, triggerKind, triggerName, releaseType, commit, started, outcome, deployed, items]
      properties:
        product: { type: string }
        subProduct: { type: string }
        title: { type: string }
        run: { type: string }
        version: { type: string }
        environment: { type: string }
        triggerKind: { type: string }
        triggerName: { type: string }
        releaseType: { type: string }
        commit: { type: string }
        started: { type: string, format: date-time }
        finished: { type: string, format: date-time }
        outcome: { type: string, enum: [running, success, failure] }
        seconds: { type: number }
        stuckAt: { type: string }
        waitingFor: { $ref: '#/components/schemas/WaitingFor' }
        failure:
          type: object
          required: [title]
          properties:
            title: { type: string }
            reason: { type: string }
            excerpt: { type: string }
            failures: { type: string }
        tag: { type: string }
        deployed: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/LiveItem' } }
    LiveItem:
      type: object
      description: A CI step or a quality gate on the line, in the order of the configuration.
      required: [kind, name, title, status, explains]
      properties:
        kind: { type: string, enum: [step, gate] }
        name: { type: string }
        title: { type: string }
        status:
          type: string
          description: Step - waiting, running, succeeded, failed, skipped, not-run. Gate - pending, deciding, waiting (for a human), open, closed, not-run.
          enum: [waiting, running, succeeded, failed, skipped, not-run, pending, deciding, open, closed]
        step: { type: integer }
        startedAt: { type: string, format: date-time }
        seconds: { type: number }
        reason: { type: string }
        excerpt: { type: string }
        explains: { type: array, items: { type: string } }
        waitingFor: { $ref: '#/components/schemas/WaitingFor' }
        tests:
          type: object
          required: [testType, tests, passed, failed, skipped, finished]
          properties:
            testType: { type: string }
            tests: { type: integer }
            passed: { type: integer }
            failed: { type: integer }
            skipped: { type: integer }
            expected: { type: integer }
            finished: { type: boolean }
    WaitingFor:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string }
        name: { type: string }
        action: { type: string }
