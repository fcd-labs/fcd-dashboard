# Server block. Runs as non-root (see nginx-main.conf), listens on 8080.
server_tokens off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. inlineCritical is off in angular.json, so no inline scripts are needed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Logline contract: the Pipeline and the products send log lines here (POST); GET exports the log.
    location = /api/v1/events {
        limit_except GET POST { deny all; }
        client_max_body_size 64k;
        proxy_pass http://dashboard-backend:8080/api/v1/events;
    }

    # Live view: Server-Sent Events, passed on at once and kept open (the backend ends a stream after 30 minutes).
    location = /api/v1/live {
        limit_except GET { deny all; }
        proxy_pass http://dashboard-backend:8080/api/v1/live$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Commands: the buttons of the product owner (POST), claimed and finished by the Pipeline agent.
    location ~ "^/api/v1/commands(/claim|/[0-9a-f-]{36}/done)?$" {
        limit_except GET POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://dashboard-backend:8080;
    }

    # Dashboard API for the frontend (read only).
    location /api/v1/ {
        limit_except GET { deny all; }
        proxy_pass http://dashboard-backend:8080;
    }

    location /api/ {
        return 404;
    }
}
